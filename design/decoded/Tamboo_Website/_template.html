yle=\"font-size:11.5px;color:#8a8499;font-weight:600\">Looking for<\u002Fspan><sc-raw-select value=\"{{ want }}\" sc-camel-on-change=\"{{ setWant }}\" style=\"border:none;font-family:inherit;font-weight:700;font-size:15px;background:none;padding:0;color:#1e1b2e\"><option value=\"halls\">A hall<\u002Foption><option value=\"rent\">Rentals<\u002Foption><option value=\"both\">Both<\u002Foption><\u002Fsc-raw-select><\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:2px;padding:6px 10px\"><span style=\"font-size:11.5px;color:#8a8499;font-weight:600\">Event date<\u002Fspan><input type=\"date\" value=\"{{ date }}\" sc-camel-on-change=\"{{ setDate }}\" style=\"border:none;font-family:inherit;font-weight:700;font-size:15px;background:none;padding:0;color:#1e1b2e\"><\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:2px;padding:6px 10px\"><span style=\"font-size:11.5px;color:#8a8499;font-weight:600\">Guests<\u002Fspan><input type=\"number\" value=\"{{ guests }}\" sc-camel-on-change=\"{{ setGuests }}\" style=\"border:none;font-family:inherit;font-weight:700;font-size:15px;background:none;padding:0;width:100%;color:#1e1b2e\"><\u002Flabel>\n<a href=\"Tamboo Customer App.dc.html\" style=\"min-height:52px;border-radius:16px;background:linear-gradient(135deg,#4d0013,#e75480);color:#fff;font-weight:700;font-size:15px;font-family:'Sora',sans-serif;text-decoration:none;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 12px;white-space:nowrap\">Check availability<\u002Fa>\n<\u002Fdiv>\n<div style=\"display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:#4b4560;font-weight:600\"><span>✓ Verified partners<\u002Fspan><span>✓ Live stock &amp; hall calendars<\u002Fspan><span>✓ English + 22 Indian languages<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position:relative;min-height:440px\">\n<img src=\"4032472c-a1da-43d3-9c42-d57f8b6d2082\" alt=\"Decorated function hall with tables and hanging flowers\" style=\"positi

ght: 800;\n  font-display: swap;\n  src: url(\"f2ccdddc-4e59-4241-a481-4ab27cec251b\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Sora';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"bd7f40e9-76e0-463e-9bea-4ce010de947e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"e30dd88b-9c4f-4dcd-b7d8-e2684dbe2535\"><\u002Fscript>\n<style>body{margin:0;background:#fdf3f6}\na{color:#a0133f} a:hover{color:#4d0013}\n@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}\ninput:focus,select:focus,textarea:focus{border-color:#e75480 !important;box-shadow:0 0 0 3px rgba(231,84,128,.15)}\nbutton:focus-visible{outline:2px solid #e75480;outline-offset:2px}<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:#fff6f8;font-family:'Plus Jakarta Sans',sans-serif;color:#1e1b2e\">\n\n<sc-if value=\"{{ locked }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:linear-gradient(160deg,#fff6f8 0%,#fdeef3 50%,#f8f0fb 100%)\">\n<div style=\"width:100%;max-width:400px;background:#fff;border-radius:24px;padding:32px;box-shadow:0 30px 60px -30px rgba(77,0,19,.35);display:flex;flex-direction:column;gap:16px;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span data-no-tr=\"1\" style=\"font-family:'Sora',sans-serif;font-weight:800;font-style:italic;font-size:34px;letter-spacing:-.05em;background:linear-gradient(135deg,#4d0013,#e75480);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.08em\">tamboo<\u002Fspan><span style=\"font-size:11px;font-weight:800;letter-spacing:.2em;color:#e75480;margin-top:8px\">ADMIN<\u002Fspan><\u002Fdiv>\n<div><div style=\"font-family:'Sora',sans-serif;font-size:22px;font-weight:800\">Sign in<\u002Fdiv><div style=\"font-size:13.5px;color:#6b6580;margin-top:4px\">Operations team only. Every action is logged.<\u002Fdiv><\u002Fdiv>\n<div><label style=\"font-size:12.5px;font-weight:600;color:#6b6580;display:block;margin-bottom:6px\">Work email<\u002Flabel><input value=\"{{ email }}\" sc-camel-on-change=\"{{ setEmail }}\" style=\"width:100%;height:48px;border:1.5px solid #f0e3ea;border-radius:12px;padding:0 14px;font-size:15px;font-family:inherit;outline:none;box-sizing:border-box\"><\u002Fdiv>\n<div><label style=\"font-size:12.5px;font-weight:600;color:#6b6580;display:block;margin-bottom:6px\">Password<\u002Flabel><input type=\"password\" value=\"{{ pw }}\" sc-camel-on-change=\"{{ setPw }}\" style=\"width:100%;height:48px;border:1.5px solid #f0e3ea;border-radius:12px;padding:0 14px;font-size:15px;font-family:inherit;outline:none;box-sizing:border-box\"><\u002Fdiv>\n<sc-if value=\"{{ loginErr }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"color:#dc2626;font-size:12.5px\">{{ loginErr }}<\u002Fdiv><\u002Fsc-if>\n<button sc-camel-on-click=\"{{ signIn }}\" style=\"height:50px;border:none;border-radius:999px;background:linear-gradient(135deg,#4d0013,#e75480);color:#fff;font-weight:700;font-size:15px;font-family:'Sora',sans-serif;cursor:pointer\">Sign in<\u002Fbutton>\n<div style=\"font-size:12px;color:#8a8499;text-align:center\">Demo: any password works for varun@tamboo.in<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ unlocked }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;min-height:100vh\">\n<nav style=\"width:232px;flex:none;background:#1e1b2e;color:#fff;display:flex;flex-direction:co  '#b91c1c'] };\nclass Component extends DCLogic {\n  state = { ready: false, authed: false, email: 'varun@tamboo.in', pw: '', loginErr: '', page: 'overview', bf: 'all', cfg: null, toast: '' };\n  componentDidMount() {\n    const init = () => { if (!window.TM) return setTimeout(init, 40); this.unsub = TM.subscribe(() => this.forceUpdate()); let sv = null; try { sv = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { } this.setState({ ready: true, ...(sv || {}) }); };\n    init();\n  }\n  componentWillUnmount() { this.unsub && this.unsub(); }\n  componentDidUpdate() { const st = this.state; if (st.ready) localStorage.setItem(KEY, JSON.stringify({ authed: st.authed, page: st.page, email: st.email })); }\n  flash(m) { clearTimeout(this.tt); this.setState({ toast: m }); this.tt = setTimeout(() => this.setState({ toast: '' }), 2600); }\n  log(x, what, target, before, after) { const d = new Date(); x.audit.unshift({ at: window.TM.TODAY + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'), who: this.state.email + ' (Admin)', what, target, before, after }); }\n  renderVals() {\n    const T = window.TM, st = this.state, self = this;\n    const base = { toast: st.toast, email: st.email, pw: st.pw, loginErr: st.loginErr, setEmail: (e) => self.setState({ email: e.target.value, loginErr: '' }), setPw: (e) => self.setState({ pw: e.target.value, loginErr: '' }),\n      signIn: () => { if (!/@tamboo\\.in$/.test(st.email.trim())) return self.setState({ loginErr: 'Use your @tamboo.in work email' }); if (!st.pw) return self.setState({ loginErr: 'Enter your password' }); self.setState({ authed: true, pw: '' }); } };\n    if (!st.ready || !T) return { ...base, locked: false, unlocked: false, nav: [], is: {} };\n    if (!st.authed) return { ...base, locked: true, unlocked: false, nav: [], is: {} };\n    const s = T.load(), Is = T.iconSet(React, 18);\n    const chip = (on) => on ? { bg: 'linear-gradient(135deg,#4d0013,#e75480)', color: '

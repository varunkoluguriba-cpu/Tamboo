document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.08em\">tamboo<\u002Fspan><span style=\"font-size:11px;font-weight:800;letter-spacing:.2em;color:#e75480;margin-top:8px\">ADMIN<\u002Fspan><\u002Fdiv>\n<div><div style=\"font-family:'Sora',sans-serif;font-size:22px;font-weight:800\">Sign in<\u002Fdiv><div style=\"font-size:13.5px;color:#6b6580;margin-top:4px\">Operations team only. Every action is logged.<\u002Fdiv><\u002Fdiv>\n<div><label style=\"font-size:12.5px;font-weight:600;color:#6b6580;display:block;margin-bottom:6px\">Work email<\u002Flabel><input value=\"{{ email }}\" sc-camel-on-change=\"{{ setEmail }}\" style=\"width:100%;height:48px;border:1.5px solid #f0e3ea;border-radius:12px;padding:0 14px;font-size:15px;font-family:inherit;outline:none;box-sizing:border-box\"><\u002Fdiv>\n<div><label style=\"font-size:12.5px;font-weight:600;color:#6b6580;display:block;margin-bottom:6px\">Password<\u002Flabel><input type=\"password\" value=\"{{ pw }}\" sc-camel-on-change=\"{{ setPw }}\" style=\"width:100%;height:48px;border:1.5px solid #f0e3ea;border-radius:12px;padding:0 14px;font-size:15px;font-family:inherit;outline:none;box-sizing:border-box\"><\u002Fdiv>\n<sc-if value=\"{{ loginErr }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"color:#dc2626;font-size:12.5px\">{{ loginErr }}<\u002Fdiv><\u002Fsc-if>\n<button sc-camel-on-click=\"{{ signIn }}\" style=\"height:50px;border:none;border-radius:999px;background:linear-gradient(135deg,#4d0013,#e75480);color:#fff;font-weight:700;font-size:15px;font-family:'Sora',sans-serif;cursor:pointer\">Sign in<\u002Fbutton>\n<div style=\"font-size:12px;color:#8a8499;text-align:center\">Demo: any password works for varun@tamboo.in<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ unlocked }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;min-height:100vh\">\n<nav style=\"width:232px;flex:none;background:#1e1b2e;color:#fff;display:flex;flex-direction:column;padding:22px 14px;box-sizing:border-box;gap:4px;position:sticky;top:0;height:100vh\">\n<div style=\"display:flex;align-items:baseline;gap:8px;padding:0 10px 18px\"><span data-no-tr=\"1\" style=\"font-family:'Sora',sans-serif;font-weight:800;font-style:italic;font-size:28px;letter-spacing:-.05em;color:#fff;padding-right:.06em\">tamboo<\u002Fspan><span style=\"font-size:10px;font-weight:800;letter-spacing:.2em;color:#e75480\">ADMIN<\u002Fspan><\u002Fdiv>\n<sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"8\"><button sc-camel-on-click=\"{{ n.go }}\" style=\"display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border:none;border-radius:10px;background:{{ n.bg }};color:{{ n.color }};font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;text-align:left\">{{ n.icon }}<span style=\"flex:1\">{{ n.label }}<\u002Fspan><sc-if value=\"{{ n.badge }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"min-width:20px;height:20px;border-radius:999px;background:#e75480;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px;box-sizing:border-box\">{{ n.badge }}<\u002Fspan><\u002Fsc-if><\u002Fbutton><\u002Fsc-for>\n<div style=\"margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 10px\">\n<div style=\"font-size:12px;color:#b8b2c4\">Signed in as<br><b style=\"color:#fff\">{{ email }}<\u002Fb><\u002Fdiv>\n<div style=\"display:flex;gap:6px\"><button sc-camel-on-click=\"{{ resetAll }}\" style=\"flex:1;height:34px;border:1px solid #3a3550;border-radius:999px;background:none;color:#fff;font-size:12px;font-family:inherit;cursor:pointer\">Reset demo<\u002Fbutton><button sc-camel-on-click=\"{{ signOut }}\" style=\"flex:1;height:34px;border:1px solid #3a3550;border-radius:999px;background:none;color:#fff;font-size:12px;font-family:inherit;cursor:pointer\">Sign out<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fnav>\n\n<main style=\"flex:1;min-width:0;padding:28px 32px 48px;box-sizi s.audit }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background:#fff;border-radius:18px;box-shadow:0 12px 26px -20px rgba(77,0,19,.35);overflow-x:auto\">\n<sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:13px;min-width:720px\">\n<sc-raw-thead><sc-raw-tr style=\"background:#fffafc;text-align:left;color:#6b6580\"><sc-raw-th style=\"padding:12px 18px;font-weight:600\">When<\u002Fsc-raw-th><sc-raw-th style=\"padding:12px;font-weight:600\">Who<\u002Fsc-raw-th><sc-raw-th style=\"padding:12px;font-weight:600\">Action<\u002Fsc-raw-th><sc-raw-th style=\"padding:12px;font-weight:600\">Target<\u002Fsc-raw-th><sc-raw-th style=\"padding:12px 18px;font-weight:600\">Change<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody><sc-for list=\"{{ audit }}\" as=\"a\" hint-placeholder-count=\"4\"><sc-raw-tr style=\"border-top:1px solid #f7edf1\"><sc-raw-td style=\"padding:10px 18px;color:#6b6580;white-space:nowrap\">{{ a.at }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px\">{{ a.who }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;font-weight:600\">{{ a.what }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px\">{{ a.target }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 18px;color:#4b4560\">{{ a.before }} → {{ a.after }}<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-for><\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fmain>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1e1b2e;color:#fff;border-radius:14px;padding:12px 18px;font-size:13.5px;z-index:50;animation:fadeUp .25s ease\">{{ toast }}<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst KEY = 'tamboo_admin_ui';\nconst SC = { PENDING: ['#fff7e6', '#8a5a00'], CANCELLED: ['#f3f4f6', '#6b7280'], COMPLETED: ['#e8f7f0', '#047857'], DISPUTED: ['#fdecec', '#b91c1c'] };\nclass Component extends DCLogic {\n  state = { ready: false, authed: false, email: 'varun@tamboo.in', pw: '', loginErr: '', page: 'overview', bf: 'all', cfg: null, toast: '' };\n  componentDidMount() {\n    const init = () => { if (!window.TM) return setTimeout(init, 40); this.unsub = TM.subscribe(() => this.forceUpdate()); let sv = null; try { sv = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { } this.setState({ ready: true, ...(sv || {}) }); };\n    init();\n  }\n  componentWillUnmount() { this.unsub && this.unsub(); }\n  componentDidUpdate() { const st = this.state; if (st.ready) localStorage.setItem(KEY, JSON.stringify({ authed: st.authed, page: st.page, email: st.email })); }\n  flash(m) { clearTimeout(this.tt); this.setState({ toast: m }); this.tt = setTimeout(() => this.setState({ toast: '' }), 2600); }\n  log(x, what, target, before, after) { const d = new Date(); x.audit.unshift({ at: window.TM.TODAY + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'), who: this.state.email + ' (Admin)', what, target, before, after }); }\n  renderVals() {\n    const T = window.TM, st = this.state, self = this;\n    const base = { toast: st.toast, email: st.email, pw: st.pw, loginErr: st.loginErr, setEmail: (e) => self.setState({ email: e.target.value, loginErr: '' }), setPw: (e) => self.setState({ pw: e.target.value, loginErr: '' }),\n      signIn: () => { if (!/@tamboo\\.in$/.test(st.email.trim())) return self.setState({ loginErr: 'Use your @tamboo.in work email' }); if (!st.pw) return self.setState({ loginErr: 'Enter your password' }); self.setState({ authed: true, pw: '' }); } };\n    if (!st.ready || !T) return { ...base, locked: false, unlocked: false, nav: [], is: {} };\n    if (!st.authed) return { ...base, locked: true, unlocked: false, nav: [], is: {} };\n    const s = T.load(), Is = T.iconSet(React, 18);\n    const chip = (on) => on ? { bg: 'linear-gradient(135deg,#4d0013,#e75480)', color: '#fff', border: 'transparent' } : { bg: '#fff', color: '#1e1b2e', border: '#f0e3ea' };\n    const money = (b) => { if (!b.lines.length) { const t = b.quoteTotal || 0; return { value: t, commission: Math.round(t * s.config.commission / 100) }; } const p = T.price(s, b.lines); return { value: p.subtotal + p.delivery + p.setup + p.pickup - p.discount, commission: p.commission }; };\n    const live = s.bookings.filter(b => !['CANCELLED'].includes(b.status));\n    const gmv = live.reduce((a, b) => a + money(b).value, 0), com = live.filter(b => b.status !== 'PENDING').reduce((a, b) => a + money(b).commission, 0);\n    const pendApps = s.applicants.filter(a => a.status === 'PENDING'), review = T.allProducts().filter(p => p.state === 'REVIEW'), openD = s.disputes.filter(d => d.status === 'OPEN');\n    const is = {}; is[st.page] = true;\n    const pages = [['overview', 'grid', 'Overview', 'How Tamboo is doing today'], ['partners', 'users', 'Partners', 'Approve new tent houses and manage existing ones'], ['items', 'package', 'Item approvals', 'Check new listings before customers see them'], ['bookings', 'calendar', 'Bookings', 'Every order across all partners'], ['venues', 'home', 'Halls & tokens', 'Venue listings and token pre-bookings'], ['disputes', 'alert', 'Disputes', 'Damage claims and complaints'], ['settings', 'sliders', 'Fees & coupons', 'Commission, platform fee, GST and policies'], ['audit', 'file', 'Audit log', 'Every admin and system change']];\n    const badges = { partners: pendApps.length, items: review.length, disputes: openD.length };\n    const cur = pages.find(p => p[0] === st.page) || pages[0];\n    const vStat = (id) => s.vendorStatus[id] || 'PENDING';\n    const statusCount = {}; s.bookings.forEach(b => { const k = T.STATUS_LABEL[b.status] || b.status; statusCount[k] = (statusCount[k] || 0) + 1; });\n    const maxC = Math.max(1, ...Object.values(statusCount));\n    const bRows = s.bookings.filter(b => st.bf === 'all' || (st.bf === 'active' ? !['PENDING', 'CANCELLED', 'COMPLETED', 'DISPUTED'].includes(b.status) : st.bf === 'pending' ? b.status === 'PENDING' : ['CANCELLED', 'COMPLETED', 'DISPUTED'].includes(b.status)));\n    const cfg = st.cfg || s.config;\n    const resolve = (d, outcome, after) => { T.update(x => { const dd = x.disputes.find(y => y.id === d.id); dd.status = 'RESOLVED'; dd.outcome = outcome;\n      if (d.token) { const k = (x.tokens || []).find(y => y.id === d.token); if (k) { if (after === 'CUSTOMER') { k.status = 'CLAIM_REFUNDED'; k.refund = k.amount; const e = ((x.venueEdits = x.venueEdits || {})[k.h] = x.venueEdits[k.h] || {}); e.rating = Math.round(((e.rating ?? T.venue(k.h).rating) - 0.2) * 10) / 10; x.notifications.push({ to: 'vendor', v: k.h, text: 'Warning: listing issue confirmed on ' + k.id + '. Please update your hall page.', at: T.TODAY }); } else { k.status = 'NOT_BOOKED'; k.refund = Math.round(k.amount * x.config.noBookRefundPct / 100); } } } const b = x.bookings.find(y => y.id === d.booking); if (b && b.status === 'DISPUTED') { b.status = 'COMPLETED'; (b.history = b.history || []).push(['COMPLETED', T.TODAY]); } x.notifications.push({ to: 'customer', booking: d.booking, text: `Dispute ${d.id} resolved: ${outcome}`, at: T.TODAY }); self.log(x, 'Dispute resolved', d.id, 'OPEN', after); }); self.flash('Dispute resolved. Both sides notified'); };\n    return {\n      ...base, locked: false, unlocked: true, Is, is, today: T.fmtDate(T.TODAY), pageTitle: cur[2], pageSub: cur[3],\n      nav: pages.map(([k, ic, label]) => ({ label, icon: Is[ic], bg: st.page === k ? 'rgba(231,84,128,.18)' : 'transparent', color: st.page === k ? '#fff' : '#b8b2c4', badge: badges[k] ? String(badges[k]) : '', go: () => self.setState({ page: k }) })),\n      resetAll: () => { T.reset(); self.setState({ cfg: null }); self.flash('Demo data reset'); }, signOut: () => self.setState({ authed: false }),\n      kpis: [{ label: 'Booking value (GMV)', value: T.inr(gmv), note: live.length + ' bookings' }, { label: 'Tamboo commission', value: T.inr(com), note: s.config.commission + '% of confirmed orders' }, { label: 'Live partners', value: String(T.VENDORS.filter(v => vStat(v.id) === 'VERIFIED').length), note: pendApps.length + ' applications waiting' }, { label: 'Items listed', value: String(T.liveProducts().length), note: review.length + ' awaiting approval' }],\n      attention: [[pendApps.length, 'partner applications to review', 'partners'], [review.length, 'items waiting for approval', 'items'], [openD.length, 'open disputes', 'disputes'], [s.bookings.filter(b => b.status === 'PENDING').length, 'bookings not yet accepted by partners', 'bookings']].map(([n, label, pg]) => ({ n, label, go: () => self.setState({ page: pg, bf: pg === 'bookings' ? 'pending' : st.bf }) })),\n      statusBars: Object.entries(statusCount).map(([label, n]) => ({ label, n, pct: Math.round(n / maxC * 100) + '%' })),\n      applicants: s.applicants.map(a => { const m = { PENDING: ['In review', '#fff7e6', '#8a5a00'], APPROVED: ['Approved', '#e8f7f0', '#047857'], REJECTED: ['Rejected', '#f3f4f6', '#6b7280'] }[a.status]; return { ...a, submitted: T.fmtShort(a.submitted), status: m[0], sBg: m[1], sColor: m[2], pending: a.status === 'PENDING',\n        approve: () => { T.update(x => { x.applicants.find(y => y.id === a.id).status = 'APPROVED'; self.log(x, 'Partner approved', a.name, 'PENDING', 'APPROVED'); }); self.flash(a.name + ' approved. SMS sent to ' + a.phone); },\n        reject: () => { T.update(x => { x.applicants.find(y => y.id === a.id).status = 'REJECTED'; self.log(x, 'Partner rejected', a.name, 'PENDING', 'REJECTED'); }); self.flash(a.name + ' rejected'); } }; }),\n      noApplicants: !s.applicants.length,\n      partners: T.VENDORS.map(v => { const ok = vStat(v.id) === 'VERIFIED', sus = vStat(v.id) === 'SUSPENDED'; return { name: v.name, area: v.area, rating: v.rating, initials: v.name.split(' ').map(w => w[0]).slice(0, 2).join(''), items: T.allProducts().filter(p => p.v === v.id).length, orders: s.bookings.filter(b => b.v === v.id).length,\n        status: ok ? 'Verified' : sus ? 'Suspended' : 'Not verified', sBg: ok ? '#e8f7f0' : sus ? '#fdecec' : '#fff7e6', sColor: ok ? '#047857' : sus ? '#b91c1c' : '#8a5a00', toggleLabel: ok ? 'Suspend' : 'Verify',\n        toggle: () => { const to = ok ? 'SUSPENDED' : 'VERIFIED'; T.update(x => { const was = x.vendorStatus[v.id] || 'PENDING'; x.vendorStatus[v.id] = to; if (to === 'VERIFIED') (x.customItems || []).forEach(c => { if (c.v === v.id && c.state === 'REVIEW') c.state = 'LIVE'; }); self.log(x, 'Partner status', v.name, was, to); }); self.flash(v.name + (ok ? ' suspended' : ' verified')); } }; }),\n      reviewItems: review.map(p => ({ name: p.name, vendor: T.vendor(p.v).name, cat: (T.CATEGORIES.find(c => c.id === p.cat) || { name: p.cat }).name, price: T.inr(p.price), unit: p.unit, stock: p.stock, specs: p.specs || 'No details added',\n        approve: () => { T.update(x => { const c = (x.customItems || []).find(y => y.id === p.id); if (c) c.state = 'LIVE'; self.log(x, 'Item approved', p.name, 'REVIEW', 'LIVE'); }); self.flash('Published. Customers can book it now'); },\n        reject: () => { T.update(x => { const c = (x.customItems || []).find(y => y.id === p.id); if (c) c.state = 'PAUSED'; self.log(x, 'Item rejected', p.name, 'REVIEW', 'PAUSED'); }); self.flash('Rejected. Partner asked to fix photos or details'); } })),\n      noReview: !review.length,\n      allItems: T.allProducts().map(p => { const k = p.state || 'LIVE'; const m = { LIVE: ['#e8f7f0', '#047857'], PAUSED: ['#f3f4f6', '#6b7280'], REVIEW: ['#f3eefd', '#5b21b6'] }[k] || ['#f3f4f6', '#6b7280']; return { name: p.name, vendor: T.vendor(p.v).name, price: T.inr(p.price) + ' ' + p.unit, stock: p.stock, state: { LIVE: 'Live', PAUSED: 'Paused', REVIEW: 'In review' }[k] || k, sBg: m[0], sColor: m[1] }; }),\n      bFilters: [['all', 'All'], ['pending', 'Awaiting partner'], ['active', 'Active'], ['closed', 'Closed']].map(([k, l]) => ({ label: l, ...chip(st.bf === k), pick: () => self.setState({ bf: k }) })),\n      bookings: bRows.map(b => { const m = money(b), c = SC[b.status] || ['#fdeef3', '#a0133f']; return { id: b.id, event: b.event, customer: b.customer, vendor: T.vendor(b.v).name, date: T.fmtShort(b.date), value: T.inr(m.value), commission: T.inr(m.commission), status: T.STATUS_LABEL[b.status] || b.status, sBg: c[0], sColor: c[1] }; }),\n      disputes: s.disputes.map(d => { const b = s.bookings.find(x => x.id === d.booking) || {}; const tk = d.token ? (s.tokens || []).find(x => x.id === d.token) : null; const open = d.status === 'OPEN'; return { ...d, isToken: !!d.token, isBooking: !d.token, event: tk ? T.venue(tk.h).name + ' (hall token)' : b.event || '', opened: T.fmtShort(d.opened), amount: T.inr(d.amount), status: open ? 'Open' : 'Resolved', sBg: open ? '#fdecec' : '#e8f7f0', sColor: open ? '#b91c1c' : '#047857', open, resolved: !open, outcome: d.outcome || '',\n        favVendor: () => resolve(d, d.token ? 'Listing issue not confirmed. Treated as visited, not booked: ' + s.config.noBookRefundPct + '% refunded' : `${T.inr(d.amount)} deducted from the customer’s deposit and paid to the partner`, 'VENDOR'), split: () => resolve(d, `${T.inr(d.amount / 2)} deducted from deposit, rest refunded`, 'SPLIT'), favCustomer: () => resolve(d, d.token ? 'Listing issue confirmed. Full token refunded, hall warned and rating reduced' : 'Claim rejected. Full deposit refunded to the customer', 'CUSTOMER') }; }),\n      vKpis: (() => { const tk = s.tokens || [], stt = (t) => T.tokenStatus(t, s); return [{ label: 'Venues listed', value: String(T.VENUES.length) }, { label: 'Active pre-bookings', value: String(tk.filter(t => stt(t) === 'ACTIVE').length) }, { label: 'Converted to booking', value: String(tk.filter(t => stt(t) === 'CONVERTED').length) }, { label: 'Tokens expired', value: String(tk.filter(t => stt(t) === 'EXPIRED').length) }]; })(),\n      venueRows: T.VENUES.map(v => { const ok = s.vendorStatus[v.id] === 'VERIFIED'; return { name: v.name, area: v.area, owner: v.owner, type: v.type, cap: v.seated + ' / ' + v.floating, crockery: v.crockery ? 'Yes' : 'No', rent: T.inr(v.rent), token: T.inr(v.token), status: ok ? 'Live · suspend' : 'Suspended · restore', sBg: ok ? '#e8f7f0' : '#fdecec', sColor: ok ? '#047857' : '#b91c1c', toggle: () => { T.update(x => { const was = x.vendorStatus[v.id]; x.vendorStatus[v.id] = ok ? 'SUSPENDED' : 'VERIFIED'; self.log(x, 'Venue status', v.name, was, x.vendorStatus[v.id]); }); self.flash(v.name + (ok ? ' hidden from customers' : ' live again')); } }; }),\n      tokenRows: (s.tokens || []).map(t => { const k = T.tokenStatus(t, s), c = T.TOKEN_COLOR[k]; return { id: t.id, hall: T.venue(t.h).name, customer: t.customer, date: T.fmtShort(t.date), slot: t.slot, amount: T.inr(t.amount), visitBy: new Date(T.visitBy(t, s)).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }), status: T.TOKEN_LABEL[k], sBg: c[0], sColor: c[1] }; }),\n      noDisputes: !s.disputes.length, slaH: s.config.disputeSlaH,\n      cfgFields: [['commission', 'Commission charged to partners', '%'], ['platformFee', 'Platform fee charged to customers', '%'], ['gst', 'GST', '%'], ['holdMin', 'Stock hold during payment', 'min'], ['cancelFreeDays', 'Free cancellation until', 'days'], ['cancelFeePct', 'Late cancellation fee', '%'], ['quoteExpiryH', 'Quote valid for', 'hrs'], ['tokenVisitHours', 'Hall visit window after token', 'hrs'], ['venueCommission', 'Commission on hall tokens', '%'], ['maxToken', 'Maximum hall token', '₹'], ['cancelWindowMin', 'Free cancel window after token', 'min'], ['noBookRefundPct', 'Refund if visited, not booked', '%'], ['noBookHallPct', 'Hall share if not booked', '%'], ['disputeSlaH', 'Dispute response time', 'hrs']].map(([k, label, unit]) => ({ label, unit, value: String(cfg[k]), set: (e) => { const v = e.target.value.replace(/[^\\d.]/g, ''); self.setState(x => ({ cfg: { ...(x.cfg || s.config), [k]: v } })); } })),\n      saveCfg: () => { if (!st.cfg) return self.flash('No changes'); T.update(x => { Object.keys(st.cfg).forEach(k => { const nv = parseFloat(st.cfg[k]); if (!isNaN(nv) && nv !== x.config[k]) { self.log(x, 'Setting changed', k, String(x.config[k]), String(nv)); x.config[k] = nv; } }); }); self.setState({ cfg: null }); self.flash('Settings saved'); },\n      coupons: s.coupons.map(c => ({ code: c.code, desc: (c.pct ? c.off + '% off' : T.inr(c.off) + ' off') + ' above ' + T.inr(c.min) + ' · used ' + c.uses + ' times', label: c.active ? 'Active' : 'Off', bg: c.active ? '#e8f7f0' : '#fff', color: c.active ? '#047857' : '#6b7280',\n        toggle: () => { T.update(x => { const cc = x.coupons.find(y => y.code === c.code); cc.active = !cc.active; self.log(x, 'Coupon ' + (cc.active ? 'enabled' : 'disabled'), c.code, c.active ? 'ON' : 'OFF', cc.active ? 'ON' : 'OFF'); }); } })),\n      audit: s.audit.slice(0, 60),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"

name: Keep backend awake

# Render's free tier spins the backend down after ~15 min of no traffic, so the first
# request after a lull pays a 30-50s cold-start penalty. Pinging /health regularly keeps
# it warm without needing a paid Render plan.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 55 https://tamboo-varun-backend.onrender.com/health
